name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: architectai
          POSTGRES_USER: architect
          POSTGRES_PASSWORD: architect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architect -d architectai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GITHUB_WEBHOOK_SECRET: dev-secret-change-in-production
      ARCHITECTAI_RUNTIME_WORKSPACE_DIR: ./workspace
      ARCHITECTAI_RUNTIME_REPORTS_DIR: ./.architectai/reports

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

