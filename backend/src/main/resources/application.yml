server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:architectai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      indent_output: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:dev-secret-change-in-production}

architectai:
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20240620}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-pro}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  static-analysis:
    tools:
      spotbugs:
        enabled: true
        path: ${SPOTBUGS_PATH:}
        timeout-seconds: 60
      pmd:
        enabled: true
        path: ${PMD_PATH:}
        timeout-seconds: 60
      checkstyle:
        enabled: true
        path: ${CHECKSTYLE_PATH:}
        timeout-seconds: 30
      semgrep:
        enabled: true
        path: ${SEMGREP_PATH:}
        timeout-seconds: 120
    thresholds:
      max-line-length: 120
      max-file-lines: 400
      max-method-lines: 80
  runtime:
    workspace-dir: ${ARCHITECTAI_RUNTIME_WORKSPACE_DIR:./workspace}
    reports-dir: ${ARCHITECTAI_RUNTIME_REPORTS_DIR:./.architectai/reports}
  storage:
    type: ${ARCHITECTAI_STORAGE_TYPE:local}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:architectai-reports}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.architectai: DEBUG

