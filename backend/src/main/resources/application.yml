server:
  port: 8080

spring:
  jackson:
    serialization:
      indent_output: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4-turbo
          temperature: 0.3
          max-tokens: 4096
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-3-sonnet-20240229
          max-tokens: 4096

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:dev-secret-change-in-production}

logging:
  level:
    root: INFO
    com.architectai: DEBUG
    org.springframework.ai: DEBUG

